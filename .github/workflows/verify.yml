name: Verify Control Room

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-control-room-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend
        run: bun install --cwd frontend --frozen-lockfile

      - name: Install agent
        run: bun install --cwd agent --frozen-lockfile

      - name: Install Playwright Chromium from locked frontend toolchain
        run: frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify
        env:
          PLAYWRIGHT_USE_BUNDLED: "1"
        run: bun run verify
