name: Deploy VPS Control Room

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-control-room-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verified manual production deploy
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true

      - name: Verify host runtimes
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.3.14"
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "22"

      - name: Stage canonical environment
        shell: bash
        run: |
          set -euo pipefail
          PERSIST="${CONTROL_ROOM_ENV_DIR:-${HOME}/.config/control-room}"
          test -f "${PERSIST}/.env.local"
          install -m 0600 "${PERSIST}/.env.local" "${GITHUB_WORKSPACE}/.env.local"

      - name: Deploy checked-out snapshot
        shell: bash
        env:
          DEPLOY_FROM_WORKTREE: "1"
          OS_EXEC_ALLOW_DESTRUCTIVE: "1"
        run: bash "${GITHUB_WORKSPACE}/scripts/deploy.sh" "${GITHUB_REF_NAME}"
